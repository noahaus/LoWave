[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-pipeline"
version = "0.1.0"
description = "Turn numbered workflow steps into a runnable Playwright test: parse -> refine -> generate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "langchain-core>=0.3",
    "python-dotenv>=1.0",
    "playwright>=1.40",
]

# Install the LLM backend you want, e.g.  pip install -e ".[anthropic]"
[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.2"]
openai = ["langchain-openai>=0.2"]
google = ["langchain-google-genai>=2.0"]
ollama = ["langchain-ollama>=0.2"]

# Console commands installed onto your PATH so you can run the tool from any
# directory once installed with `pip install -e .`:
[project.scripts]
qa-parse = "qa_pipeline.parse_steps:main"
qa-refine = "qa_pipeline.refine_plan:main"
qa-generate = "qa_pipeline.generate:main"

[tool.setuptools]
packages = ["qa_pipeline"]
