<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kestrel — Expense Reports</title>
<style>
  /* ---- Design tokens ---------------------------------------------------- */
  :root{
    --bg:#f5f6f8;
    --panel:#ffffff;
    --sidebar:#111820;
    --sidebar-2:#1a2430;
    --ink:#18202b;
    --body:#4d5765;
    --muted:#8a93a1;
    --line:#e5e8ec;
    --line-2:#eef0f3;
    --brand:#0f7d6e;
    --brand-600:#0b6558;
    --brand-tint:#e6f4f1;
    --amber:#b45309; --amber-bg:#fdf1dc;
    --green:#15803d; --green-bg:#dcf3e3;
    --red:#c0362c;   --red-bg:#fbe6e4;
    --slate:#576270; --slate-bg:#eef0f3;
    --focus:#0f7d6e;
    --radius:10px;
    --shadow:0 1px 2px rgba(20,30,45,.06), 0 6px 20px rgba(20,30,45,.06);
    --mono:"SF Mono",ui-monospace,"Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{color:var(--ink);margin:0;font-weight:650;letter-spacing:-.01em}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:inherit}
  a{color:var(--brand);text-decoration:none}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

  /* ---- Buttons ---------------------------------------------------------- */
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:8px;
    padding:9px 15px;font-weight:600;line-height:1;transition:background .12s,border-color .12s,opacity .12s}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-600)}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{background:#f7f8fa}
  .btn-danger{background:#fff;border-color:var(--red);color:var(--red)}
  .btn-danger:hover{background:var(--red-bg)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-sm{padding:6px 11px;font-size:13px}

  /* ---- Form fields ------------------------------------------------------ */
  .field{margin-bottom:16px}
  .field label{display:block;font-weight:600;color:var(--ink);margin-bottom:6px;font-size:13px}
  .field .hint{color:var(--muted);font-weight:400}
  .control{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  .control:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-tint)}
  .control.invalid{border-color:var(--red);box-shadow:0 0 0 3px var(--red-bg)}
  .err{color:var(--red);font-size:12.5px;margin-top:5px;display:none}
  .err.show{display:block}

  /* ---- Badges ----------------------------------------------------------- */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .badge.pending{color:var(--amber);background:var(--amber-bg)}
  .badge.approved{color:var(--green);background:var(--green-bg)}
  .badge.rejected{color:var(--red);background:var(--red-bg)}
  .badge.draft{color:var(--slate);background:var(--slate-bg)}

  /* ---- Auth screen ------------------------------------------------------ */
  .auth{min-height:100%;display:grid;place-items:center;padding:24px}
  .auth-card{width:100%;max-width:392px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:32px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:700}
  .brand-name{font-weight:700;color:var(--ink);font-size:16px;letter-spacing:-.02em}
  .auth-card h1{font-size:20px;margin-bottom:4px}
  .auth-sub{color:var(--muted);margin-bottom:22px}
  .cred-hint{margin-top:16px;padding:10px 12px;background:#f7f8fa;border:1px dashed var(--line);border-radius:8px;font-size:12.5px;color:var(--body)}
  .banner{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
  .banner.show{display:block}
  .banner.error{background:var(--red-bg);color:var(--red);border:1px solid #f2c9c4}

  /* ---- App shell -------------------------------------------------------- */
  .shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
  .sidebar{background:var(--sidebar);color:#c4ccd6;padding:20px 14px;display:flex;flex-direction:column;gap:4px}
  .sidebar .brand{margin:6px 8px 22px}
  .sidebar .brand-name{color:#fff}
  .nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:#aab4c0;font-weight:550;cursor:pointer}
  .nav-item:hover{background:var(--sidebar-2);color:#fff}
  .nav-item.active{background:var(--brand);color:#fff}
  .nav-item svg{width:17px;height:17px;flex:none}
  .nav-spacer{flex:1}
  .nav-user{border-top:1px solid #232f3c;padding-top:12px;margin-top:8px}
  .nav-user .who{padding:2px 8px 10px}
  .nav-user .name{color:#fff;font-weight:600;font-size:13px}
  .nav-user .mail{color:#7f8b98;font-size:12px}

  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{height:60px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;
    justify-content:space-between;padding:0 28px;flex:none}
  .topbar h2{font-size:16px}
  .crumbs{color:var(--muted);font-size:13px}
  .crumbs b{color:var(--ink);font-weight:600}
  .content{padding:28px;overflow:auto}

  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .stat .k{color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  .stat .v{font-size:26px;color:var(--ink);font-weight:700;margin-top:8px}
  .stat .v small{font-size:14px;color:var(--muted);font-weight:600}

  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
  .panel-head h3{font-size:15px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .search{position:relative}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
  .search input{padding-left:32px;width:230px}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:12px 18px;border-bottom:1px solid var(--line-2);font-size:13.5px}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em;font-weight:650;user-select:none}
  th.sortable{cursor:pointer}
  th.sortable:hover{color:var(--ink)}
  th .arrow{opacity:.4;font-size:10px;margin-left:3px}
  th.sorted .arrow{opacity:1;color:var(--brand)}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#f9fafb}
  td .rid{color:var(--muted)}
  td.amt{text-align:right}
  .empty{padding:36px;text-align:center;color:var(--muted)}

  /* ---- Wizard ----------------------------------------------------------- */
  .wizard{max-width:760px}
  .steps{display:flex;gap:0;margin-bottom:24px}
  .step{flex:1;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;font-weight:600}
  .step .num{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none;background:#fff}
  .step.active{color:var(--ink)}
  .step.active .num{border-color:var(--brand);color:var(--brand)}
  .step.done .num{background:var(--brand);border-color:var(--brand);color:#fff}
  .step .bar{flex:1;height:1.5px;background:var(--line);margin:0 4px}
  .wcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .line-items{margin-top:8px}
  .li-row{display:grid;grid-template-columns:1.4fr 1fr 130px 100px 34px;gap:10px;align-items:end;margin-bottom:12px}
  .li-total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line-2);padding-top:16px;margin-top:8px}
  .li-total .t-label{color:var(--muted);font-weight:600}
  .li-total .t-val{font-size:22px;font-weight:700;color:var(--ink)}
  .icon-btn{width:34px;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--red);display:grid;place-items:center}
  .icon-btn:hover{background:var(--red-bg)}
  .review-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-2)}
  .review-line:last-child{border-bottom:none}
  .wizard-foot{display:flex;justify-content:space-between;margin-top:20px}
  .attach{display:flex;align-items:center;gap:8px}
  .attach .chip{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--green-bg);color:var(--green);font-weight:600;display:none}
  .attach .chip.show{display:inline-block}

  /* ---- Detail ----------------------------------------------------------- */
  .detail-grid{display:grid;grid-template-columns:1fr 300px;gap:20px}
  .meta dt{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-top:14px}
  .meta dd{margin:4px 0 0;color:var(--ink);font-weight:600}

  /* ---- Settings --------------------------------------------------------- */
  .settings{max-width:640px}
  .toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line-2)}
  .toggle:last-child{border-bottom:none}
  .toggle .lbl{color:var(--ink);font-weight:600}
  .toggle .desc{color:var(--muted);font-size:12.5px;font-weight:400}
  .switch{position:relative;width:42px;height:24px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .track{position:absolute;inset:0;background:#cdd3da;border-radius:999px;transition:background .15s}
  .track::before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input:checked + .track{background:var(--brand)}
  .switch input:checked + .track::before{transform:translateX(18px)}

  /* ---- Toast / spinner / modal ------------------------------------------ */
  .toasts{position:fixed;top:18px;right:18px;display:flex;flex-direction:column;gap:10px;z-index:50}
  .toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.2);
    font-size:13.5px;font-weight:550;display:flex;align-items:center;gap:9px;animation:slidein .2s ease}
  .toast.success{background:#0e3b31}
  .toast .dot{width:8px;height:8px;border-radius:50%;background:#3fcf9a;flex:none}
  @keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
  .spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
    animation:spin .6s linear infinite;display:inline-block}
  .spinner.dark{border-color:var(--line);border-top-color:var(--brand)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .overlay{position:fixed;inset:0;background:rgba(17,24,32,.45);display:grid;place-items:center;z-index:40}
  .modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:420px;box-shadow:var(--shadow)}
  .modal h3{font-size:17px;margin-bottom:8px}
  .modal p{color:var(--body);margin:0 0 20px}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px}
  .center-load{display:grid;place-items:center;padding:60px;gap:12px;color:var(--muted)}

  @media(max-width:820px){
    .shell{grid-template-columns:1fr}
    .sidebar{display:none}
    .cards{grid-template-columns:repeat(2,1fr)}
    .detail-grid{grid-template-columns:1fr}
    .li-row{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div class="toasts" id="toasts"></div>

<script>
/* =========================================================================
   Kestrel — a deterministic demo SaaS for recording QA workflows.
   Pure vanilla JS. Hash routing. In-memory state (resets on reload by design,
   so every recorded run starts from an identical, reproducible state).
   ========================================================================= */

const CREDENTIALS = { email:"demo@kestrel.app", password:"test1234" };

// Fixed seed data — no randomness, so QA scripts are reproducible.
const SEED_REPORTS = [
  { id:"EXP-1042", title:"NYC client visit — Q2 review",   category:"Travel",       amount:1284.50, status:"pending",  submitted:"2026-06-28", items:3 },
  { id:"EXP-1039", title:"Team offsite catering",           category:"Meals",        amount:642.00,  status:"approved", submitted:"2026-06-21", items:2 },
  { id:"EXP-1035", title:"Figma + Notion annual licenses",  category:"Software",     amount:456.00,  status:"approved", submitted:"2026-06-14", items:2 },
  { id:"EXP-1031", title:"Conference registration",         category:"Training",     amount:899.00,  status:"rejected", submitted:"2026-06-09", items:1 },
  { id:"EXP-1028", title:"Airport parking + rideshare",     category:"Travel",       amount:112.75,  status:"approved", submitted:"2026-06-02", items:4 },
];

const state = {
  user:null,
  reports:JSON.parse(JSON.stringify(SEED_REPORTS)),
  // reports table controls
  q:"", statusFilter:"all", sortKey:"submitted", sortDir:"desc",
  // wizard
  wizard:null,
};

/* ---- Utilities ---------------------------------------------------------- */
const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>[...root.querySelectorAll(sel)];
const app = $("#app");
const fmtMoney = n => "$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

function toast(msg,type="success"){
  const t=document.createElement("div");
  t.className="toast "+type;
  t.setAttribute("role","status");
  t.innerHTML=`<span class="dot"></span><span>${msg}</span>`;
  $("#toasts").appendChild(t);
  setTimeout(()=>{t.style.opacity="0";t.style.transform="translateX(20px)";t.style.transition="all .2s";
    setTimeout(()=>t.remove(),200);},2600);
}

const ICONS = {
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>',
  logout:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>',
};

const CATEGORIES = ["Travel","Meals","Software","Training","Office","Other"];

/* ---- Router ------------------------------------------------------------- */
function go(hash){ location.hash = hash; }
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

function render(){
  const route = (location.hash || "#/login").replace(/^#/,"");
  // Auth gate
  if(!state.user && route !== "/login"){ location.hash = "#/login"; return; }
  if(state.user && route === "/login"){ location.hash = "#/dashboard"; return; }

  if(route === "/login")           return renderLogin();
  if(route === "/dashboard")       return renderShell("dashboard", viewDashboard());
  if(route === "/reports")         return renderShell("reports",   viewReports());
  if(route === "/reports/new")     return renderShell("reports",   viewWizard());
  if(route.startsWith("/reports/"))return renderShell("reports",   viewDetail(route.split("/")[2]));
  if(route === "/settings")        return renderShell("settings",  viewSettings());
  location.hash = "#/dashboard";
}

/* ---- Login -------------------------------------------------------------- */
function renderLogin(){
  app.innerHTML = `
  <div class="auth">
    <div class="auth-card">
      <div class="brand"><div class="brand-mark">K</div><span class="brand-name">Kestrel</span></div>
      <h1>Sign in</h1>
      <p class="auth-sub">Expense reports for your team.</p>
      <div class="banner error" id="loginBanner" role="alert"></div>
      <div class="field">
        <label for="email">Work email</label>
        <input class="control" id="email" type="email" placeholder="you@company.com" data-testid="login-email" autocomplete="username">
        <div class="err" id="emailErr">Enter your work email.</div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="control" id="password" type="password" placeholder="••••••••" data-testid="login-password" autocomplete="current-password">
        <div class="err" id="passwordErr">Enter your password.</div>
      </div>
      <button class="btn btn-primary" id="signInBtn" data-testid="login-submit" style="width:100%;justify-content:center">Sign in</button>
      <div class="cred-hint">Demo login — <b>demo@kestrel.app</b> / <b>test1234</b></div>
    </div>
  </div>`;

  const email=$("#email"), pass=$("#password"), btn=$("#signInBtn"), banner=$("#loginBanner");
  const clearErr=()=>{[email,pass].forEach(f=>f.classList.remove("invalid"));
    $("#emailErr").classList.remove("show");$("#passwordErr").classList.remove("show");banner.classList.remove("show");};
  email.addEventListener("input",clearErr);
  pass.addEventListener("input",clearErr);

  btn.addEventListener("click",()=>{
    clearErr();
    let ok=true;
    if(!email.value.trim()){ email.classList.add("invalid"); $("#emailErr").classList.add("show"); ok=false; }
    if(!pass.value.trim()){ pass.classList.add("invalid"); $("#passwordErr").classList.add("show"); ok=false; }
    if(!ok) return;

    btn.disabled=true; btn.innerHTML=`<span class="spinner"></span> Signing in…`;
    // Deterministic ~800ms auth delay
    setTimeout(()=>{
      if(email.value.trim().toLowerCase()===CREDENTIALS.email && pass.value===CREDENTIALS.password){
        state.user={ name:"Dana Whitmore", email:CREDENTIALS.email, role:"Employee" };
        go("#/dashboard");
      }else{
        btn.disabled=false; btn.textContent="Sign in";
        banner.textContent="That email and password don't match. Try the demo login below.";
        banner.classList.add("show");
      }
    },800);
  });
  pass.addEventListener("keydown",e=>{ if(e.key==="Enter") btn.click(); });
}

/* ---- App shell ---------------------------------------------------------- */
function navItem(id,active,icon,label){
  return `<div class="nav-item ${active?'active':''}" data-nav="${id}" data-testid="nav-${id}" role="link" tabindex="0">
    ${ICONS[icon]}<span>${label}</span></div>`;
}
function renderShell(active, body){
  app.innerHTML = `
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">K</div><span class="brand-name">Kestrel</span></div>
      ${navItem("dashboard",active==="dashboard","grid","Dashboard")}
      ${navItem("reports",active==="reports","list","Reports")}
      ${navItem("settings",active==="settings","gear","Settings")}
      <div class="nav-spacer"></div>
      <div class="nav-user">
        <div class="who"><div class="name">${state.user.name}</div><div class="mail">${state.user.email}</div></div>
        <div class="nav-item" data-action="logout" data-testid="nav-logout" role="link" tabindex="0">${ICONS.logout}<span>Sign out</span></div>
      </div>
    </aside>
    <div class="main">${body}</div>
  </div>`;

  $$(".nav-item[data-nav]").forEach(el=>{
    const fn=()=>go("#/"+el.dataset.nav);
    el.addEventListener("click",fn);
    el.addEventListener("keydown",e=>{if(e.key==="Enter")fn();});
  });
  const out=$('[data-action="logout"]');
  if(out){ out.addEventListener("click",()=>{ state.user=null; go("#/login"); }); }

  // Per-view wiring
  if(active==="dashboard") wireDashboard();
  if(active==="reports" && $("#reportsTable")) wireReports();
  if(active==="reports" && $("#wizard")) wireWizard();
  if(active==="settings") wireSettings();
  if($("#detail")) wireDetail();
}

function topbar(crumbHTML, actionsHTML=""){
  return `<div class="topbar"><div class="crumbs">${crumbHTML}</div><div class="toolbar">${actionsHTML}</div></div>`;
}

/* ---- Dashboard ---------------------------------------------------------- */
function viewDashboard(){
  const r=state.reports;
  const pending=r.filter(x=>x.status==="pending");
  const pendingAmt=pending.reduce((s,x)=>s+x.amount,0);
  const approvedYTD=r.filter(x=>x.status==="approved").reduce((s,x)=>s+x.amount,0);
  const recent=[...r].sort((a,b)=>b.submitted.localeCompare(a.submitted)).slice(0,4);

  return topbar(`<b>Dashboard</b>`, `<button class="btn btn-primary" id="newFromDash" data-testid="dash-new-report">${ICONS.plus} New report</button>`)
  + `<div class="content">
    <div class="cards">
      <div class="stat"><div class="k">Pending</div><div class="v" data-testid="stat-pending">${pending.length} <small>reports</small></div></div>
      <div class="stat"><div class="k">Awaiting approval</div><div class="v mono" data-testid="stat-pending-amt">${fmtMoney(pendingAmt)}</div></div>
      <div class="stat"><div class="k">Approved (YTD)</div><div class="v mono" data-testid="stat-approved">${fmtMoney(approvedYTD)}</div></div>
      <div class="stat"><div class="k">Total reports</div><div class="v" data-testid="stat-total">${r.length}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h3>Recent activity</h3><a href="#/reports" data-testid="dash-view-all">View all →</a></div>
      <table>
        <thead><tr><th>Report</th><th>Category</th><th>Status</th><th style="text-align:right">Amount</th></tr></thead>
        <tbody>
          ${recent.map(x=>`<tr data-open="${x.id}">
            <td><b style="color:var(--ink)">${x.title}</b><br><span class="rid mono" style="font-size:12px">${x.id}</span></td>
            <td>${x.category}</td>
            <td><span class="badge ${x.status}">${cap(x.status)}</span></td>
            <td class="amt mono">${fmtMoney(x.amount)}</td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
}
function wireDashboard(){
  $("#newFromDash").addEventListener("click",()=>{ startWizard(); go("#/reports/new"); });
  $$('tr[data-open]').forEach(tr=>tr.addEventListener("click",()=>go("#/reports/"+tr.dataset.open)));
}

/* ---- Reports list ------------------------------------------------------- */
function viewReports(){
  return topbar(`<b>Reports</b>`, `<button class="btn btn-primary" id="newFromList" data-testid="reports-new">${ICONS.plus} New report</button>`)
  + `<div class="content">
    <div class="panel">
      <div class="panel-head">
        <h3>All reports</h3>
        <div class="toolbar">
          <div class="search">${ICONS.search}
            <input class="control" id="searchBox" placeholder="Search reports…" data-testid="reports-search" value="${state.q}">
          </div>
          <select class="control" id="statusFilter" data-testid="reports-status-filter" style="width:150px">
            <option value="all">All statuses</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
      </div>
      <div id="reportsTable">${reportsTableHTML()}</div>
    </div>
  </div>`;
}
function reportsTableHTML(){
  let rows = state.reports.filter(r=>{
    const matchQ = (r.title+" "+r.id+" "+r.category).toLowerCase().includes(state.q.toLowerCase());
    const matchS = state.statusFilter==="all" || r.status===state.statusFilter;
    return matchQ && matchS;
  });
  const dir = state.sortDir==="asc"?1:-1;
  rows.sort((a,b)=>{
    let av=a[state.sortKey], bv=b[state.sortKey];
    if(state.sortKey==="amount") return (av-bv)*dir;
    return String(av).localeCompare(String(bv))*dir;
  });
  const arrow=k=> state.sortKey===k ? (state.sortDir==="asc"?"▲":"▼") : "↕";
  const th=(k,label,extra="")=>`<th class="sortable ${state.sortKey===k?'sorted':''}" data-sort="${k}" ${extra}>${label}<span class="arrow">${arrow(k)}</span></th>`;
  if(rows.length===0){
    return `<div class="empty" data-testid="reports-empty">No reports match your search. Try clearing the filters.</div>`;
  }
  return `<table><thead><tr>
    ${th("title","Report")}
    ${th("category","Category")}
    ${th("submitted","Submitted")}
    ${th("status","Status")}
    ${th("amount","Amount",'style="text-align:right"')}
  </tr></thead><tbody data-testid="reports-rows">
    ${rows.map(x=>`<tr data-open="${x.id}">
      <td><b style="color:var(--ink)">${x.title}</b><br><span class="rid mono" style="font-size:12px">${x.id}</span></td>
      <td>${x.category}</td>
      <td class="mono">${x.submitted}</td>
      <td><span class="badge ${x.status}">${cap(x.status)}</span></td>
      <td class="amt mono">${fmtMoney(x.amount)}</td>
    </tr>`).join("")}
  </tbody></table>`;
}
function wireReports(){
  $("#newFromList").addEventListener("click",()=>{ startWizard(); go("#/reports/new"); });
  const refresh=()=>{ $("#reportsTable").innerHTML=reportsTableHTML(); bindTableEvents(); };
  const search=$("#searchBox");
  search.addEventListener("input",e=>{ state.q=e.target.value; refresh(); });
  const sf=$("#statusFilter"); sf.value=state.statusFilter;
  sf.addEventListener("change",e=>{ state.statusFilter=e.target.value; refresh(); });
  bindTableEvents();
  function bindTableEvents(){
    $$('#reportsTable th[data-sort]').forEach(th=>th.addEventListener("click",()=>{
      const k=th.dataset.sort;
      if(state.sortKey===k){ state.sortDir = state.sortDir==="asc"?"desc":"asc"; }
      else { state.sortKey=k; state.sortDir="asc"; }
      refresh();
    }));
    $$('#reportsTable tr[data-open]').forEach(tr=>tr.addEventListener("click",()=>go("#/reports/"+tr.dataset.open)));
  }
}

/* ---- New report wizard -------------------------------------------------- */
function startWizard(){
  state.wizard = {
    step:1,
    title:"", tripDate:"", category:"Travel", notes:"",
    receipt:false,
    items:[{ desc:"", cat:"Travel", date:"", amount:"" }],
  };
}
function wizardTotal(){
  return state.wizard.items.reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
}
function viewWizard(){
  if(!state.wizard) startWizard();
  const w=state.wizard;
  const stepClass=n=> n<w.step?"done":(n===w.step?"active":"");
  return topbar(`<a href="#/reports">Reports</a> / <b>New report</b>`)
  + `<div class="content"><div class="wizard" id="wizard">
    <div class="steps">
      <div class="step ${stepClass(1)}"><span class="num">${w.step>1?"✓":"1"}</span>Trip details</div>
      <div class="bar"></div>
      <div class="step ${stepClass(2)}"><span class="num">${w.step>2?"✓":"2"}</span>Expenses</div>
      <div class="bar"></div>
      <div class="step ${stepClass(3)}"><span class="num">3</span>Review</div>
    </div>
    <div id="wizardBody">${wizardStepHTML()}</div>
  </div></div>`;
}
function wizardStepHTML(){
  const w=state.wizard;
  if(w.step===1){
    return `<div class="wcard">
      <div class="field">
        <label for="wTitle">Report title</label>
        <input class="control" id="wTitle" data-testid="wiz-title" placeholder="e.g. Client visit — Chicago" value="${escapeAttr(w.title)}">
        <div class="err" id="wTitleErr">Give the report a title.</div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="wDate">Trip date</label>
          <input class="control" id="wDate" type="date" data-testid="wiz-date" value="${w.tripDate}">
          <div class="err" id="wDateErr">Select a date.</div>
        </div>
        <div class="field">
          <label for="wCat">Primary category</label>
          <select class="control" id="wCat" data-testid="wiz-category">
            ${CATEGORIES.map(c=>`<option ${c===w.category?"selected":""}>${c}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="field">
        <label for="wNotes">Notes <span class="hint">(optional)</span></label>
        <textarea class="control" id="wNotes" data-testid="wiz-notes" rows="3" placeholder="Purpose of the trip, attendees, etc.">${escapeAttr(w.notes)}</textarea>
      </div>
    </div>
    <div class="wizard-foot">
      <a class="btn btn-ghost" href="#/reports">Cancel</a>
      <button class="btn btn-primary" id="wNext1" data-testid="wiz-next">Continue</button>
    </div>`;
  }
  if(w.step===2){
    return `<div class="wcard">
      <h3 style="font-size:15px;margin-bottom:4px">Add expense line items</h3>
      <p style="color:var(--muted);margin:0 0 18px">Each row is one charge. The total updates as you type.</p>
      <div class="line-items" id="lineItems">${lineItemsHTML()}</div>
      <button class="btn btn-ghost btn-sm" id="addItem" data-testid="wiz-add-item">${ICONS.plus} Add line item</button>
      <div class="li-total">
        <span class="t-label">Report total</span>
        <span class="t-val mono" id="wizTotal" data-testid="wiz-total">${fmtMoney(wizardTotal())}</span>
      </div>
      <div class="attach" style="margin-top:18px">
        <button class="btn btn-ghost btn-sm" id="attachBtn" data-testid="wiz-attach">Attach receipt</button>
        <span class="chip ${w.receipt?'show':''}" id="attachChip" data-testid="wiz-receipt-chip">receipt.pdf attached</span>
      </div>
      <div class="err" id="itemsErr" style="margin-top:10px">Add at least one line item with a description and amount.</div>
    </div>
    <div class="wizard-foot">
      <button class="btn btn-ghost" id="wBack2" data-testid="wiz-back">${ICONS.back} Back</button>
      <button class="btn btn-primary" id="wNext2" data-testid="wiz-next">Review</button>
    </div>`;
  }
  // step 3 review
  return `<div class="wcard">
    <h3 style="font-size:15px;margin-bottom:14px">Review &amp; submit</h3>
    <div class="review-line"><span>Title</span><b style="color:var(--ink)">${escapeHTML(w.title)}</b></div>
    <div class="review-line"><span>Trip date</span><b class="mono" style="color:var(--ink)">${w.tripDate||"—"}</b></div>
    <div class="review-line"><span>Category</span><b style="color:var(--ink)">${w.category}</b></div>
    <div class="review-line"><span>Line items</span><b style="color:var(--ink)">${w.items.filter(validItem).length}</b></div>
    <div class="review-line"><span>Receipt</span><b style="color:var(--ink)">${w.receipt?"Attached":"Not attached"}</b></div>
    <div class="review-line" style="padding-top:16px"><span style="font-size:16px;color:var(--ink);font-weight:650">Total</span>
      <b class="mono" style="font-size:20px;color:var(--ink)">${fmtMoney(wizardTotal())}</b></div>
  </div>
  <div class="wizard-foot">
    <button class="btn btn-ghost" id="wBack3" data-testid="wiz-back">${ICONS.back} Back</button>
    <button class="btn btn-primary" id="wSubmit" data-testid="wiz-submit">Submit for approval</button>
  </div>`;
}
function lineItemsHTML(){
  return state.wizard.items.map((it,i)=>`
    <div class="li-row" data-idx="${i}">
      <div class="field" style="margin:0">
        ${i===0?'<label>Description</label>':''}
        <input class="control li-desc" data-testid="li-desc-${i}" placeholder="What was it?" value="${escapeAttr(it.desc)}">
      </div>
      <div class="field" style="margin:0">
        ${i===0?'<label>Category</label>':''}
        <select class="control li-cat" data-testid="li-cat-${i}">
          ${CATEGORIES.map(c=>`<option ${c===it.cat?"selected":""}>${c}</option>`).join("")}
        </select>
      </div>
      <div class="field" style="margin:0">
        ${i===0?'<label>Date</label>':''}
        <input class="control li-date" type="date" data-testid="li-date-${i}" value="${it.date}">
      </div>
      <div class="field" style="margin:0">
        ${i===0?'<label>Amount</label>':''}
        <input class="control li-amt" type="number" min="0" step="0.01" data-testid="li-amt-${i}" placeholder="0.00" value="${it.amount}">
      </div>
      <button class="icon-btn li-del" data-testid="li-del-${i}" title="Remove line" aria-label="Remove line ${i+1}">${ICONS.trash}</button>
    </div>`).join("");
}
function validItem(it){ return it.desc.trim() && parseFloat(it.amount)>0; }

function wireWizard(){
  const w=state.wizard;
  const rerender=()=>{ $("#wizardBody").innerHTML=wizardStepHTML(); wireWizard(); };

  if(w.step===1){
    const t=$("#wTitle"), d=$("#wDate"), c=$("#wCat"), n=$("#wNotes");
    t.addEventListener("input",e=>w.title=e.target.value);
    d.addEventListener("change",e=>w.tripDate=e.target.value);
    c.addEventListener("change",e=>w.category=e.target.value);
    n.addEventListener("input",e=>w.notes=e.target.value);
    $("#wNext1").addEventListener("click",()=>{
      let ok=true;
      if(!w.title.trim()){ t.classList.add("invalid"); $("#wTitleErr").classList.add("show"); ok=false; }
      if(!w.tripDate){ d.classList.add("invalid"); $("#wDateErr").classList.add("show"); ok=false; }
      if(ok){ w.step=2; rerenderView(); }
    });
  }
  if(w.step===2){
    const bindItems=()=>{
      $$(".li-row").forEach(row=>{
        const i=+row.dataset.idx;
        row.querySelector(".li-desc").addEventListener("input",e=>w.items[i].desc=e.target.value);
        row.querySelector(".li-cat").addEventListener("change",e=>w.items[i].cat=e.target.value);
        row.querySelector(".li-date").addEventListener("change",e=>w.items[i].date=e.target.value);
        row.querySelector(".li-amt").addEventListener("input",e=>{ w.items[i].amount=e.target.value; $("#wizTotal").textContent=fmtMoney(wizardTotal()); });
        row.querySelector(".li-del").addEventListener("click",()=>{
          if(w.items.length>1){ w.items.splice(i,1); }
          else { w.items=[{desc:"",cat:"Travel",date:"",amount:""}]; }
          $("#lineItems").innerHTML=lineItemsHTML(); bindItems(); $("#wizTotal").textContent=fmtMoney(wizardTotal());
        });
      });
    };
    bindItems();
    $("#addItem").addEventListener("click",()=>{
      w.items.push({desc:"",cat:w.category,date:"",amount:""});
      $("#lineItems").innerHTML=lineItemsHTML(); bindItems();
    });
    $("#attachBtn").addEventListener("click",()=>{ w.receipt=true; $("#attachChip").classList.add("show"); });
    $("#wBack2").addEventListener("click",()=>{ w.step=1; rerenderView(); });
    $("#wNext2").addEventListener("click",()=>{
      if(w.items.filter(validItem).length===0){ $("#itemsErr").classList.add("show"); return; }
      w.step=3; rerenderView();
    });
  }
  if(w.step===3){
    $("#wBack3").addEventListener("click",()=>{ w.step=2; rerenderView(); });
    $("#wSubmit").addEventListener("click",()=>{
      const btn=$("#wSubmit"); btn.disabled=true; btn.innerHTML=`<span class="spinner"></span> Submitting…`;
      // Deterministic ~1200ms submit
      setTimeout(()=>{
        const nextId="EXP-"+(1043 + (state.reports.length - SEED_REPORTS.length));
        state.reports.unshift({
          id:nextId, title:w.title, category:w.category, amount:wizardTotal(),
          status:"pending", submitted:new Date().toISOString().slice(0,10),
          items:w.items.filter(validItem).length,
        });
        state.wizard=null;
        go("#/reports");
        toast("Report submitted for approval");
      },1200);
    });
  }
  function rerenderView(){ renderShell("reports", viewWizard()); }
}

/* ---- Report detail ------------------------------------------------------ */
function viewDetail(id){
  const r=state.reports.find(x=>x.id===id);
  if(!r){ return topbar(`<a href="#/reports">Reports</a> / <b>Not found</b>`)+`<div class="content"><div class="empty">Report ${escapeHTML(id)} doesn't exist.</div></div>`; }
  return topbar(`<a href="#/reports">Reports</a> / <b>${r.id}</b>`)
  + `<div class="content" id="detail" data-report="${r.id}">
    <div class="detail-grid">
      <div class="panel">
        <div class="panel-head"><h3>${escapeHTML(r.title)}</h3><span class="badge ${r.status}" data-testid="detail-status">${cap(r.status)}</span></div>
        <div style="padding:18px">
          <dl class="meta" style="margin:0">
            <dt>Report ID</dt><dd class="mono">${r.id}</dd>
            <dt>Category</dt><dd>${r.category}</dd>
            <dt>Submitted</dt><dd class="mono">${r.submitted}</dd>
            <dt>Line items</dt><dd>${r.items}</dd>
          </dl>
        </div>
      </div>
      <div class="panel" style="align-self:start">
        <div class="panel-head"><h3>Total</h3></div>
        <div style="padding:18px">
          <div class="mono" style="font-size:30px;font-weight:700;color:var(--ink)" data-testid="detail-amount">${fmtMoney(r.amount)}</div>
          ${r.status==="pending"?`<button class="btn btn-danger" id="withdrawBtn" data-testid="detail-withdraw" style="width:100%;justify-content:center;margin-top:16px">Withdraw report</button>`:""}
          <a class="btn btn-ghost" href="#/reports" style="width:100%;justify-content:center;margin-top:10px">${ICONS.back} Back to reports</a>
        </div>
      </div>
    </div>
  </div>`;
}
function wireDetail(){
  const wb=$("#withdrawBtn");
  if(!wb) return;
  const id=$("#detail").dataset.report;
  wb.addEventListener("click",()=>{
    app.insertAdjacentHTML("beforeend",`
      <div class="overlay" id="confirmOverlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
          <h3 id="confirmTitle">Withdraw this report?</h3>
          <p>${id} will be removed from the approval queue. You can create a new report anytime.</p>
          <div class="modal-foot">
            <button class="btn btn-ghost" id="confirmCancel" data-testid="confirm-cancel">Keep it</button>
            <button class="btn btn-danger" id="confirmYes" data-testid="confirm-withdraw">Withdraw</button>
          </div>
        </div>
      </div>`);
    $("#confirmCancel").addEventListener("click",()=>$("#confirmOverlay").remove());
    $("#confirmYes").addEventListener("click",()=>{
      state.reports=state.reports.filter(x=>x.id!==id);
      $("#confirmOverlay").remove();
      go("#/reports");
      toast("Report withdrawn");
    });
  });
}

/* ---- Settings ----------------------------------------------------------- */
function viewSettings(){
  return topbar(`<b>Settings</b>`)
  + `<div class="content"><div class="settings">
    <div class="panel">
      <div class="panel-head"><h3>Profile</h3></div>
      <div style="padding:18px">
        <div class="field">
          <label for="sName">Full name</label>
          <input class="control" id="sName" data-testid="settings-name" value="${escapeAttr(state.user.name)}">
        </div>
        <div class="field">
          <label for="sEmail">Email</label>
          <input class="control" id="sEmail" type="email" data-testid="settings-email" value="${escapeAttr(state.user.email)}">
          <div class="err" id="sEmailErr">Enter a valid email.</div>
        </div>
      </div>
    </div>
    <div class="panel" style="margin-top:20px">
      <div class="panel-head"><h3>Notifications</h3></div>
      <div style="padding:6px 18px 14px">
        <div class="toggle">
          <div><div class="lbl">Approval updates</div><div class="desc">Email me when a report is approved or rejected.</div></div>
          <label class="switch"><input type="checkbox" id="tgApproval" data-testid="settings-toggle-approval" checked><span class="track"></span></label>
        </div>
        <div class="toggle">
          <div><div class="lbl">Weekly summary</div><div class="desc">A Monday digest of pending reports.</div></div>
          <label class="switch"><input type="checkbox" id="tgWeekly" data-testid="settings-toggle-weekly"><span class="track"></span></label>
        </div>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:20px">
      <button class="btn btn-primary" id="saveSettings" data-testid="settings-save">Save changes</button>
    </div>
  </div></div>`;
}
function wireSettings(){
  $("#saveSettings").addEventListener("click",()=>{
    const email=$("#sEmail"), name=$("#sName");
    $("#sEmailErr").classList.remove("show"); email.classList.remove("invalid");
    if(!/^\S+@\S+\.\S+$/.test(email.value.trim())){
      email.classList.add("invalid"); $("#sEmailErr").classList.add("show"); return;
    }
    const btn=$("#saveSettings"); btn.disabled=true; btn.innerHTML=`<span class="spinner"></span> Saving…`;
    setTimeout(()=>{
      state.user.name=name.value; state.user.email=email.value;
      btn.disabled=false; btn.textContent="Save changes";
      toast("Settings saved");
    },600);
  });
}

/* ---- Small helpers ------------------------------------------------------ */
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function escapeHTML(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function escapeAttr(s){ return String(s).replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
</script>
</body>
</html>
